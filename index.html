
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INVICTUS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --line:#d8d2c4;
  --text:#1c1c1a; --muted:#5f5c53; --accent:#1f5c4a;
  --field:#fff; --hover:#ebe6da; --on-accent:#fff;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121413; --panel:#1a1d1b; --line:#2f3532;
  --text:#e9e6dd; --muted:#a19f95; --accent:#6fbf9f;
  --field:#121413; --hover:#262b28; --on-accent:#0f1f18;
}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:min(100% - 32px,560px);margin:0 auto;padding:48px 0 32px}
header{padding-bottom:24px;margin-bottom:32px;border-bottom:1px solid var(--line)}
.logo{font:700 32px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.04em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px;margin-bottom:20px}
h2{font-size:20px;line-height:1.3;margin:0 0 8px}
p{color:var(--muted);font-size:14px;line-height:1.6;margin:0}
input,select,button{display:block;width:100%;padding:12px 14px;margin-top:12px;border:1px solid var(--line);
  border-radius:6px;background:var(--field);color:var(--text);font:inherit;text-align:left}
button{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.12)}
button.secondary{background:transparent;color:var(--text);border-color:var(--line)}
button.secondary:hover{background:var(--hover);filter:none}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:8px;margin-bottom:24px}
.tabs button{margin:0}
.hidden{display:none!important}
.message{min-height:1.5em;margin-top:16px;font-size:14px;color:var(--text)}
.task{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.task input{flex:none;width:20px;height:20px;margin:0;padding:0;accent-color:var(--accent)}
.task span{flex:1;font-size:15px}
.small{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row button{display:inline-block;width:auto;margin:0;padding:10px 16px}
.stat{font-size:28px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
#streamLabel{margin:4px 0 24px}
#taskList{margin-bottom:8px}
#auth{text-align:center}
main:has(#auth:not(.hidden)) header{text-align:center}
#auth input,#auth button{text-align:center}
</style>
</head>
<body>
<main>
<header>
  <div class="logo">INVICTUS</div>
</header>

<section id="auth">
  <div class="panel">
    <div class="tabs">
      <button id="loginTab" onclick="showTab('login')">LOGIN</button>
      <button class="secondary" id="registerTab" onclick="showTab('register')">REGISTER</button>
    </div>

    <div id="loginForm">
      <input id="loginUsername" placeholder="Username" autocomplete="username">
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
      <button onclick="login()">Sign in</button>
    </div>

    <div id="registerForm" class="hidden">
      <input id="regPasscode" type="password" placeholder="Access passcode">
      <input id="regUsername" placeholder="Choose username (3–20 characters)" autocomplete="username">
      <input id="regPassword" type="password" placeholder="Choose password (minimum 8 characters)" autocomplete="new-password">
      <select id="regStream">
        <option value="PCM_CS">PCM + Computer Science</option>
        <option value="PCM_BIO">PCM + Biology</option>
      </select>
      <button onclick="register()">Create account</button>
    </div>
    <div id="authMessage" class="message" aria-live="polite"></div>
  </div>
</section>

<section id="dashboard" class="hidden">
  <div class="panel">
    <div class="row">
      <div>
        <h2 id="welcomeName">User</h2>
      </div>
      <button class="secondary" onclick="logout()">Logout</button>
    </div>
    <p id="streamLabel"></p>
    <div class="small">TODAY'S COMPLETION</div>
    <div class="stat" id="progressCount">0 / 0</div>
    <div class="small" style="margin-top:14px">CURRENT STREAK</div>
    <div class="stat" id="streakCount">0 days</div>
  </div>

  <div id="taskArea" class="panel">
    <h2>Academics</h2>
    <div id="taskList"></div>
    <input id="newTask" placeholder="Add a personal task">
    <button class="secondary" onclick="addTask()">+ Add custom task</button>
  </div>
</section>

</main>

<script>
const SUPABASE_URL = "https://knxprrltvmsbegrejqgn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ZHB5pnHhS5XC5fzV2VPLbA_OmQwCJCT";

const configured =
  !SUPABASE_URL.startsWith("YOUR_") &&
  !SUPABASE_ANON_KEY.startsWith("YOUR_");

let db = null;
let currentProfile = null;
let tasks = [];
let progress = [];

if (configured) {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

function showMessage(text) {
  document.getElementById("authMessage").textContent = text;
}

function showTab(tab) {
  document.getElementById("loginForm").classList.toggle("hidden", tab !== "login");
  document.getElementById("registerForm").classList.toggle("hidden", tab !== "register");
  document.getElementById("loginTab").classList.toggle("secondary", tab !== "login");
  document.getElementById("registerTab").classList.toggle("secondary", tab !== "register");
  showMessage("");
}

function showScreen(id) {
  ["auth","dashboard"].forEach(x =>
    document.getElementById(x).classList.add("hidden")
  );
  document.getElementById(id).classList.remove("hidden");
}

async function register() {
  if (!configured) return showMessage("Add your Supabase project URL and anon key first.");

  const username = document.getElementById("regUsername").value.trim();
  const password = document.getElementById("regPassword").value;
  const passcode = document.getElementById("regPasscode").value;
  const stream = document.getElementById("regStream").value;

  showMessage("Creating your account...");

  try {
    const response = await fetch(SUPABASE_URL + "/functions/v1/register-user", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY
      },
      body: JSON.stringify({username,password,passcode,stream})
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Registration failed.");
    showMessage(result.message || "Account created. You can now log in.");
    showTab("login");
    document.getElementById("loginUsername").value = username;
    document.getElementById("loginPassword").value = "";
  } catch (e) {
    showMessage(e.message);
  }
}

async function login() {
  if (!configured) return showMessage("Add your Supabase project URL and anon key first.");

  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value;
  showMessage("Signing in...");

  try {
    const response = await fetch(SUPABASE_URL + "/functions/v1/username-login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY
      },
      body: JSON.stringify({username,password})
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || "Login failed.");

    const {error} = await db.auth.setSession({
      access_token: result.access_token,
      refresh_token: result.refresh_token
    });
    if (error) throw error;

    await loadProfile();
  } catch(e) {
    showMessage(e.message);
  }
}

async function loadProfile() {
  const {data: authData, error: authError} = await db.auth.getUser();
  if (authError || !authData.user) {
    return showMessage("Could not verify your login session. Please sign in again.");
  }

  const {data,error} = await db.from("profiles")
    .select("username,stream,role,status")
    .eq("id", authData.user.id)
    .single();

  if (error) return showMessage("Could not load your profile.");
  currentProfile = data;

  if (data.status !== "approved") {
    await logout();
    return showMessage("This account is not active.");
  }

  document.getElementById("welcomeName").textContent = data.username;
  document.getElementById("streamLabel").textContent =
    data.stream === "PCM_CS" ? "PCM + Computer Science" : "PCM + Biology";

  showScreen("dashboard");
  await loadTasks();
}

async function loadTasks() {
  const {data,error} = await db.from("tasks")
    .select("*")
    .eq("is_active",true)
    .order("created_at");

  if (error) {
    document.getElementById("taskList").textContent = "Could not load tasks.";
    return;
  }
  tasks = data || [];

  const {data: authData} = await db.auth.getUser();
  if (!authData.user) return;

  const today = new Date().toLocaleDateString("en-CA");
  const {data:records, error:progressError} = await db.from("daily_progress")
    .select("*")
    .eq("user_id", authData.user.id)
    .eq("task_date",today);

  if (progressError) {
    document.getElementById("taskList").textContent = "Could not load daily progress.";
    return;
  }

  progress = records || [];
  renderTasks();
  loadStreak(authData.user.id);
}

function renderTasks() {
  const list = document.getElementById("taskList");
  list.innerHTML = "";

  tasks.forEach(task => {
    const done = progress.some(p => p.task_id === task.id && p.completed);
    const item = document.createElement("label");
    item.className = "task";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = done;
    checkbox.addEventListener("change", () => toggleTask(task, checkbox.checked));

    const name = document.createElement("span");
    name.textContent = task.title;

item.append(checkbox,name);
    if (!task.is_core) {
      const del = document.createElement("button");
      del.className = "secondary";
      del.style.cssText = "width:auto;margin:0;padding:6px 10px";
      del.textContent = "Delete";
      del.setAttribute("aria-label", "Delete task");
      del.addEventListener("click", e => { e.preventDefault(); deleteTask(task); });
      item.append(del);
    }
    list.append(item);
  });

  const completed = progress.filter(p => p.completed).length;
  document.getElementById("progressCount").textContent =
    completed + " / " + tasks.length;
}

async function toggleTask(task, completed) {
  const today = new Date().toLocaleDateString("en-CA");
  const {data:authData} = await db.auth.getUser();
  if (!authData.user) return;

  const userId = authData.user.id;

  const {data:existing, error:lookupError} = await db.from("daily_progress")
    .select("id")
    .eq("user_id",userId)
    .eq("task_id",task.id)
    .eq("task_date",today)
    .maybeSingle();

  if (lookupError) {
    alert("Could not check task status: " + lookupError.message);
    return;
  }

  let result;
  if (existing) {
    result = await db.from("daily_progress")
      .update({completed})
      .eq("id",existing.id);
  } else {
    result = await db.from("daily_progress")
      .insert({user_id:userId,task_id:task.id,task_date:today,completed});
  }

  if (result.error) {
    alert("Could not update task: " + result.error.message);
    return;
  }
  await loadTasks();
}

async function deleteTask(task) {
  if (!confirm("Delete this task?")) return;
  // soft delete keeps past progress rows valid
  const {error} = await db.from("tasks").update({is_active:false}).eq("id",task.id);
  if (error) return alert("Could not delete task: " + error.message);
  await loadTasks();
}

// shortcut: reads the latest 1000 completed rows, so very long streaks cap out; move to a SQL view if that matters
async function loadStreak(userId) {
  const {data} = await db.from("daily_progress").select("task_date")
    .eq("user_id",userId).eq("completed",true)
    .order("task_date",{ascending:false}).limit(1000);
  const days = new Set((data || []).map(r => r.task_date));
  const d = new Date();
  if (!days.has(d.toLocaleDateString("en-CA"))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(d.toLocaleDateString("en-CA"))) { n++; d.setDate(d.getDate() - 1); }
  document.getElementById("streakCount").textContent = n + (n === 1 ? " day" : " days");
}

async function addTask() {
  const title = document.getElementById("newTask").value.trim();
  if (!title) return;

  const {data:authData} = await db.auth.getUser();
  if (!authData.user) return alert("Please sign in again.");

  const {error} = await db.from("tasks").insert({
    owner_id:authData.user.id,
    title,
    category:"Academics",
    subject:"Personal",
    is_core:false,
    stream_scope:currentProfile.stream,
    is_active:true
  });

  if (error) return alert("Could not add task: " + error.message);
  document.getElementById("newTask").value = "";
  await loadTasks();
}

async function logout() {
  if (db) await db.auth.signOut();
  currentProfile = null;
  showScreen("auth");
  showTab("login");
}

if (!configured) {
  showMessage("Setup needed: add your Supabase project URL and anon key in the code.");
}
if (db) db.auth.getSession().then(({data}) => { if (data.session) loadProfile(); });
</script>
</body>
</html>
